[project]
name = "phishcheck"
version = "0.1.0"
description = "Email parsing and typed phishing triage"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE", "LICENSE-tailwindcss"]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "dspy>=3.5.0",
    "eml-parser>=4.7.1",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "litellm>=1.109.1",
    "magika>=1.0.3",
    "mlflow>=3.18.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[project.scripts]
phishcheck = "phishcheck.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phishcheck"]

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.15.22", "mypy>=2.3.0"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["phishcheck"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["dspy", "dspy.*"]
ignore_missing_imports = true
