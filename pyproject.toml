[project]
name = "emailscan"
version = "0.1.0"
description = "Typed event assessment with DSPy and Jev"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dspy>=3.5.0",
    "litellm>=1.109.1",
    "mlflow>=3.18.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
emailscan = "emailscan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emailscan"]

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.15.22", "mypy>=2.3.0"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["emailscan"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["dspy", "dspy.*"]
ignore_missing_imports = true
